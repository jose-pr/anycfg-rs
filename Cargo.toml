[package]
name = "anycfg"
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Serde configuration documents from bytes, streams, and ordered merged sources"
repository = "https://github.com/jose-pr/anycfg-rs"
keywords = ["config", "serde", "toml", "yaml", "json"]
categories = ["config", "encoding"]
readme = "README.md"
exclude = [".*", "*.local.*"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
serde = "1"
toml = "0.9"
serde_json = "1"
serde-saphyr = { version = "2", default-features = false, features = ["deserialize", "serialize"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
