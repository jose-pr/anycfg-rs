name: Docs

# Keep a single Pages deploy workflow, matching the other Rust repositories.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - "Cargo.toml"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build docs and Rust API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Rust API reference
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Install documentation tooling
        run: python -m pip install "mkdocs-material>=9,<10"
      - name: Build narrative documentation
        run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - name: Include Rust API reference
        run: |
          mkdir -p site/rust
          cp -r target/doc/. site/rust/
          printf '%s' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=anycfg/index.html"><title>anycfg Rust API</title><p><a href="anycfg/index.html">anycfg Rust API</a></p>' > site/rust/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
