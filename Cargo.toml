[package]
name = "anycfg"
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.89"
description = "Format-neutral configuration discovery, loading, and layering"
repository = "https://github.com/jose-pr/anycfg-rs"
readme = "README.md"
publish = false
exclude = [".*", "*.local.*"]

[lib]
name = "anycfg"
path = "src/lib.rs"

[dependencies]
serde = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
serde-saphyr = "2"

[package.metadata.docs.rs]
all-features = true
